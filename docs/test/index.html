<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Lab (Test)</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=0.4.1-t09">
<meta name="theme-color" content="#141a1f">
<style>
  :root{
    --bg:#141a1f; --panel:#1c242b; --panel2:#222c34; --border:#2e3a43; --border-soft:#283440;
    --text:#eef2f4; --text-dim:#9aa7af; --text-mute:#69747c;
    --accent:#f5a623; --accent-dim:#a86a17; --accent-text:#0d1a14;
    --warn:#d9a441; --err:#d96a4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.4;
  }
  a{color:var(--accent);}
  .hidden{display:none !important;}
  .btn{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer;}
  .btn:hover{border-color:var(--accent-dim);}
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn-primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
  .btn-primary:hover{border-color:var(--accent);}
  .btn-small{padding:4px 9px; font-size:12px; border-radius:6px;}
  .btn.active{background:var(--accent-dim); border-color:var(--accent); color:var(--text);}
  input, select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; font:inherit; width:100%;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent-dim);}
  label{display:block; font-size:13px; color:var(--text-dim); margin:0 0 6px;}

  header{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:10px 16px;
    border-bottom:1px solid var(--border-soft); background:var(--panel);
  }
  .brand-block{display:flex; flex-direction:row; align-items:center; gap:10px; justify-self:start; -webkit-user-select:none; user-select:none;}
  .brand-block img{width:36px; height:36px; display:block; flex-shrink:0;}
  .brand-text{display:flex; flex-direction:column;}
  .brand-text h1{font-size:16px; margin:0; font-weight:700;}
  .version-sub{font-size:10px; color:var(--text-mute); line-height:1.3;}
  .badge{display:inline-block; padding:1px 8px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); font-size:11px; color:var(--text-dim);}
  .greeting{display:flex; flex-direction:column; align-items:center; text-align:center; justify-self:center; font-size:13px; color:var(--text-dim);}
  .greeting-name{color:var(--text); font-weight:700; font-size:14px;}
  .header-actions{display:flex; gap:8px; justify-self:end;}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; padding:0; flex-shrink:0;
    background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; cursor:pointer;
  }
  .icon-btn:hover{border-color:var(--accent-dim);}
  .icon-btn svg{width:18px; height:18px;}

  main{min-height:calc(100vh - 45px); display:flex; flex-direction:column; align-items:center; padding:24px; gap:20px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:32px 28px; max-width:360px; width:100%; margin:auto;}
  .card h2{margin:0 0 20px; font-size:20px;}
  .field{margin-bottom:14px;}
  .error{color:var(--err); font-size:13px; margin-top:10px; min-height:16px;}
  .muted{color:var(--text-dim); font-size:13px;}

  #loginScreen.card{margin:auto;}

  #adminScreen{max-width:640px; width:100%; margin:0 auto;}
  #adminScreen .add-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  #adminScreen .add-row .field{flex:1; min-width:110px; margin-bottom:0;}

  .tabs{display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid var(--border-soft); padding-bottom:10px;}
  .tab-btn{background:transparent; border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer;}
  .tab-btn.active{background:var(--panel2); color:var(--text); border-color:var(--accent-dim);}
  .admin-panel h2{font-size:16px; margin:0 0 14px;}

  table.user-list{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  table.user-list th, table.user-list td{padding:8px 6px; border-bottom:1px solid var(--border-soft); text-align:left; vertical-align:middle;}
  table.user-list select{padding:5px 6px; width:auto;}
  table.user-list .inline-action-row input{width:120px; display:inline-block;}

  #updateBanner{display:none; align-items:center; gap:10px; padding:8px 14px; background:var(--warn); color:#25200a; font-size:13px;}
  #updateBanner button{border:1px solid #25200a55; background:transparent; color:#25200a; border-radius:6px; padding:4px 10px; font:inherit; cursor:pointer;}

  #versionBadge{cursor:pointer;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; padding:24px; z-index:100;}
  #changelogCard{max-width:380px; max-height:80vh; overflow-y:auto;}
  .changelog-entry{margin-bottom:16px;}
  .changelog-entry:last-child{margin-bottom:0;}
  .changelog-version{font-weight:700;}
  .changelog-date{color:var(--text-dim); font-weight:400; font-size:12px; margin-left:8px;}
  #changelogList ul{margin:6px 0 0; padding-left:18px;}
  #changelogList li{margin-bottom:4px; font-size:14px;}

  #casesScreen, #caseDetailScreen, #clientViewScreen{max-width:860px; width:100%; margin:0 auto; text-align:left;}
  .cases-header{display:flex; align-items:center; justify-content:flex-end; margin-bottom:16px;}
  /* Still used by the client-facing view (client-view.js), which keeps its
     own simpler flat table -- see SPEC.md's "Client-facing view" (minimal
     by design). Only the team-facing Cases screen moved to per-case-type
     cards below. */
  table.case-list{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  table.case-list th, table.case-list td{padding:8px 6px; border-bottom:1px solid var(--border-soft); text-align:left; vertical-align:middle;}
  table.case-list tr.case-row{cursor:pointer;}
  table.case-list tr.case-row:hover{background:var(--panel2);}
  .badge-onhold{background:var(--warn); color:#25200a; border:none;}
  .badge-priority{background:var(--err); color:#2a0e08; border:none; margin-left:4px;}

  .type-card{margin-bottom:20px;}
  .type-card h2{margin:0 0 10px; font-size:16px;}
  .case-row-item{padding:10px 0; border-bottom:1px solid var(--border-soft); cursor:pointer;}
  .case-row-item:last-child{border-bottom:none;}
  .case-row-item:hover{background:var(--panel2);}
  .case-row-top{font-size:14px; font-weight:600;}
  .case-row-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:4px; gap:10px;}
  .case-row-meta{font-size:12px; color:var(--text-dim);}
  .case-row-status{font-size:12px; color:var(--text-dim); text-align:right;}
  .case-row-status.status-priority{color:var(--err); font-weight:700;}

  .case-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:14px;}
  .case-field{margin-bottom:0;}
  .case-field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .case-toggles{display:flex; flex-wrap:wrap; gap:16px; margin-top:14px;}
  .checkbox-inline{display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;}
  .checkbox-inline input{width:auto;}
  .warn-text{color:var(--warn); font-size:12px; margin-top:4px;}

  .case-detail-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .case-title{font-size:15px; margin:0 0 16px; color:var(--text-dim);}
  .case-title strong{color:var(--text);}

  .case-section{margin-top:24px; padding-top:16px; border-top:1px solid var(--border-soft);}
  .case-section:first-child{margin-top:0; padding-top:0; border-top:none;}
  .case-section h3{margin:0 0 12px; font-size:15px; display:flex; align-items:center; gap:10px;}
  .add-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:10px;}
  .add-row .field{flex:1; min-width:120px; margin-bottom:0;}

  .sample-card{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px;}
  .sample-card-header{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .action-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .action-row:last-child{border-bottom:none;}
  .execute-form input{width:160px; display:inline-block;}
  #backToCasesBtn{margin-bottom:0;}

  .value-list{margin:6px 0;}
  .value-row{display:flex; gap:6px; margin-bottom:6px;}
  .value-row input{font-size:12px; padding:6px 8px;}

  .note-item{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;}
  .note-item .note-meta{font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  .note-item .note-replies{margin-left:20px; margin-top:10px; border-left:2px solid var(--border-soft); padding-left:12px;}
  .note-category{display:inline-block; padding:1px 7px; border-radius:8px; background:var(--panel); border:1px solid var(--border); font-size:11px; color:var(--text-dim); margin-left:8px;}
</style>
</head>
<body>

<div id="updateBanner">
  <span>A new version is available.</span>
  <button id="reloadBtn">Reload</button>
  <button id="dismissBtn" style="margin-left:auto;">Dismiss</button>
</div>

<header>
  <div class="brand-block" id="headerLogo">
    <img src="icon.svg?v=0.4.1-t09" alt="">
    <div class="brand-text">
      <h1>smart-lab</h1>
      <span class="version-sub" id="versionBadge"></span>
    </div>
  </div>
  <div class="greeting hidden" id="greeting"></div>
  <div class="header-actions">
    <button type="button" class="icon-btn hidden" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
      </svg>
    </button>
    <button type="button" class="icon-btn hidden" id="logoutBtn" title="Log out" aria-label="Log out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <path d="M16 17l5-5-5-5"></path>
        <path d="M21 12H9"></path>
      </svg>
    </button>
  </div>
</header>

<main>

  <div id="loginScreen" class="card">
    <h2>Log in</h2>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Log in</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <div id="settingsScreen" class="card hidden">
    <h2>Settings</h2>
    <h3 style="margin:0 0 12px; font-size:14px; color:var(--text-dim); font-weight:600;">Change password</h3>
    <form id="changePasswordForm">
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" required>
      </div>
      <div class="field">
        <label for="newOwnPassword">New password</label>
        <input type="password" id="newOwnPassword" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Update password</button>
      <div class="error" id="changePasswordError"></div>
      <p class="muted" id="changePasswordSuccess"></p>
    </form>
  </div>

  <div id="adminScreen" class="card hidden">
    <div class="tabs" id="adminTabs">
      <button type="button" class="tab-btn active" data-tab="adminUsersPanel">Users</button>
      <button type="button" class="tab-btn" data-tab="adminCaseTypesPanel">Case types</button>
      <button type="button" class="tab-btn" data-tab="adminClientsPanel">Clients</button>
    </div>

    <div id="adminUsersPanel" class="admin-panel">
      <h2>Users</h2>
      <form id="addUserForm">
        <div class="add-row">
          <div class="field">
            <label for="newUsername">Username</label>
            <input type="text" id="newUsername" required>
          </div>
          <div class="field">
            <label for="newPassword">Password</label>
            <input type="password" id="newPassword" required>
          </div>
          <div class="field">
            <label for="newRole">Role</label>
            <!-- No "admin" option: there's exactly one admin (this account),
                 it's not editable through this screen, and there's no second
                 admin to promote. -->
            <select id="newRole">
              <option value="client">Client</option>
              <option value="team_leader">Team leader</option>
              <option value="worker">Worker</option>
            </select>
          </div>
          <div class="field" id="newUserClientOrgField" hidden>
            <label for="newUserClientOrg">Client org</label>
            <select id="newUserClientOrg"></select>
          </div>
          <button type="submit" class="btn btn-primary" id="addUserBtn">Add user</button>
        </div>
        <div class="error" id="addUserError"></div>
      </form>
      <table class="user-list">
        <thead>
          <tr><th>Username</th><th>Role</th><th></th></tr>
        </thead>
        <tbody id="userListBody"></tbody>
      </table>
    </div>

    <div id="adminCaseTypesPanel" class="admin-panel hidden">
      <h2>Case types</h2>
      <form id="addCaseTypeForm">
        <div class="add-row">
          <div class="field">
            <label for="newCaseTypeName">Name</label>
            <input type="text" id="newCaseTypeName" required>
          </div>
          <div class="field">
            <label for="newCaseTypeTat">TAT goal (days)</label>
            <input type="number" id="newCaseTypeTat" min="0">
          </div>
          <label class="checkbox-inline" style="margin-bottom:10px;">
            <input type="checkbox" id="newCaseTypeSeedDefault"> Seed default workflow
          </label>
          <button type="submit" class="btn btn-primary">Add case type</button>
        </div>
        <div class="error" id="addCaseTypeError"></div>
      </form>
      <table class="user-list">
        <thead>
          <tr><th>Name</th><th>TAT goal</th><th></th></tr>
        </thead>
        <tbody id="caseTypeListBody"></tbody>
      </table>
    </div>

    <div id="adminClientsPanel" class="admin-panel hidden">
      <h2>Clients</h2>
      <form id="addClientOrgForm">
        <div class="add-row">
          <div class="field">
            <label for="newClientOrgName">New client org name</label>
            <input type="text" id="newClientOrgName" required>
          </div>
          <button type="submit" class="btn btn-primary">Add client org</button>
        </div>
        <div class="error" id="addClientOrgError"></div>
      </form>
      <div id="clientOrgListBody"></div>
    </div>
  </div>

  <div id="casesScreen" class="hidden">
    <div class="cases-header">
      <button type="button" class="btn btn-primary btn-small hidden" id="showNewCaseFormBtn">+ New case</button>
    </div>

    <form id="newCaseForm" class="card hidden">
      <div class="add-row">
        <div class="field">
          <label for="newCaseNumber">Case number</label>
          <input type="text" id="newCaseNumber" required>
        </div>
        <button type="button" class="btn btn-small" id="genTempNumberBtn">Generate temp #</button>
        <div class="field">
          <label for="newClientCaseNumber">Client case number</label>
          <input type="text" id="newClientCaseNumber">
        </div>
      </div>
      <div class="add-row">
        <div class="field">
          <label for="newCaseName">Name</label>
          <input type="text" id="newCaseName">
        </div>
        <div class="field">
          <label for="newCaseClientOrg">Client org</label>
          <select id="newCaseClientOrg"><option value="">(none)</option></select>
        </div>
        <div class="field">
          <label for="newCaseClient">Client</label>
          <select id="newCaseClient"><option value="">(none)</option></select>
        </div>
      </div>
      <div class="add-row">
        <div class="field">
          <label for="newCaseStartDate">Start date</label>
          <input type="date" id="newCaseStartDate">
        </div>
        <div class="field">
          <label for="newCaseType">Case type</label>
          <select id="newCaseType"><option value="">(none)</option></select>
        </div>
        <div class="field">
          <label for="newCaseManager">Case manager (optional)</label>
          <select id="newCaseManager"><option value="">Unassigned</option></select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Create case</button>
      <div class="error" id="newCaseError"></div>
    </form>

    <div id="caseTypeGroups"></div>
  </div>

  <div id="caseDetailScreen" class="card hidden">
    <div class="case-detail-header">
      <button type="button" class="btn btn-small" id="backToCasesBtn">&larr; Back to cases</button>
      <button type="button" class="btn btn-small" id="toggleNotesBtn">Notes</button>
    </div>
    <p class="case-title" id="caseDetailTitle"></p>
    <div id="caseMainView"></div>
    <div id="caseNotesView" class="hidden"></div>
  </div>

  <div id="clientViewScreen" class="card hidden">
    <h2>Cases</h2>
    <div class="field" id="clientFilterField" hidden>
      <label for="clientFilterSelect">Filter to a specific client</label>
      <select id="clientFilterSelect"><option value="">All clients</option></select>
    </div>
    <table class="case-list">
      <thead><tr><th>Case</th><th></th></tr></thead>
      <tbody id="clientCaseListBody"></tbody>
    </table>
  </div>

</main>

<div id="changelogOverlay" class="modal-overlay hidden">
  <div class="card" id="changelogCard">
    <h2>What's new</h2>
    <div id="changelogList"></div>
    <button type="button" class="btn btn-primary" id="changelogCloseBtn" style="width:100%; margin-top:16px;">Close</button>
  </div>
</div>

<script type="module" src="js/auth-ui.js?v=0.4.1-t09"></script>
<script type="module" src="js/admin-ui.js?v=0.4.1-t09"></script>
<script type="module" src="js/case-types-ui.js?v=0.4.1-t09"></script>
<script type="module" src="js/clients-ui.js?v=0.4.1-t09"></script>
<script type="module" src="js/cases.js?v=0.4.1-t09"></script>
<script type="module" src="js/client-view.js?v=0.4.1-t09"></script>
<script type="module" src="js/update-banner.js?v=0.4.1-t09"></script>
<script type="module" src="js/changelog.js?v=0.4.1-t09"></script>
</body>
</html>
